<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validando formulário</title>
  </head>
  <body>
    <h1>Formulário</h1>
    <form id="myForm">
      <label>Campo A</label>
      <input id="numbA" type="number" placeholder="0" />

      <label>Campo B</label>
      <input id="numbB" type="number" placeholder="0" />

      <button type="submit">Verificar</button>

      <p id="text"></p>
    </form>
  </body>

  <script>
    document.getElementById("myForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const numbA = document.getElementById("numbA").value;
      const numbB = document.getElementById("numbB").value;
      const text = document.getElementById("text");

      if (numbA > numbB) {
        text.innerText = "✅ Sucesso! O número B é maior que o número A.";
      } else {
        text.innerText = "❌ Erro: O número B deve ser maior que o número A.";
      }
    });
  </script>
</html>
